[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certainty"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "boto3>=1.34",
    "python-docx>=1.1",
    "click>=8.1",
]

[project.optional-dependencies]
google = ["google-cloud-documentai>=2.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
certainty = "cert_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

line-length = 100
[tool.ruff.lint]
# The portfolio-standard rule set. Absent here, so this project linted against ruff's bare
# defaults while its CI still ran `ruff check` -- which is how findings accumulated unseen.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
[tool.hatch.build.targets.wheel]
packages = ["src/cert_validator"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are prompt text and log f-strings; see the note in twinlane.
"src/cert_validator/backends/claude_vision.py" = ["E501"]
"src/cert_validator/core/pipeline.py" = ["E501"]
